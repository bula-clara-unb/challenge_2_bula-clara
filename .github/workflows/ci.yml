name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs para a main só podem vir da dev
  origem-pr-main:
    name: PR para main vem da dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar branch de origem
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs para main devem partir da branch dev (origem: $HEAD_REF)."
            exit 1
          fi

  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências do sistema (Tesseract PT + fontes)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por fonts-dejavu-core

      # Os testes usam LLM mock + TF-IDF: não precisam de torch/transformers/chromadb
      - name: Dependências Python (leves)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pypdf scikit-learn pydantic fastapi requests pillow pytesseract python-multipart

      - name: Rodar testes
        env:
          BULA_RECUPERADOR: tfidf
        run: python -m pytest -q

  frontend:
    name: Frontend (lint, tipos, testes, axe, Storybook)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Dependências
        run: pnpm install --frozen-lockfile

      - name: Chromium para os testes das stories
        run: pnpm --filter @bula-clara/ui exec playwright install --with-deps chromium

      - name: Tokens (build + teste de contraste)
        run: pnpm --filter @bula-clara/tokens test

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes dos componentes e das stories (com axe)
        run: pnpm --filter @bula-clara/ui test

      - name: Build do Storybook
        run: pnpm build-storybook

      - name: Publicar o Storybook como artefato
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: frontend/packages/ui/storybook-static
          retention-days: 14
